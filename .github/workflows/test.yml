name: Test

on:
  pull_request:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r test-requirements.txt
          python -m pip install -e .
      - name: Check Python formatting and whitespace
        run: pre-commit run --all-files
      - name: Check browser JavaScript syntax
        run: node --check src/chirp_web/webui/static/app.js
      - name: Type-check web API boundaries
        run: mypy
      - name: Run unit and package tests
        run: pytest src/tests/unit src/tests/e2e/test_package.py
      - name: Run Chromium browser tests
        run: CHIRP_WEB_BROWSERS=chromium pytest src/tests/e2e/test_browser.py -q
