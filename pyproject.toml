[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "chirp-web"
authors = [
    {name = "Tom Masterson", email = "kd7cyu@gmail.com"}
]
description = "Rewrite of the chirp program using a web ui"
readme = "README.md"
license = "GPL-3.0-or-later"
classifiers = [
    "Private :: Do Not Upload",
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Ham Radio",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = [
    "pyserial",
    "requests",
    "suds",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pywin32; platform_system == 'Windows'",
]
dynamic = ["version"]

[project.scripts]
chirp-web = "chirp_web.webui.main:main"

[tool.setuptools_scm]
version_file = "src/chirp_web/__version__.py"

[tools.setup.package-data]
"chirp_web" = ["py.typed"]

[tool.setuptools.package-data]
chirp_web = ["py.typed", "webui/static/*"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
log_file = "pytest.log"
log_file_mode = "w"
addopts = [
    "--import-mode=importlib",
]
