[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "chirp-web"
authors = [
    {name = "Tom Masterson", email = "kd7cyu@gmail.com"}
]
description = "Rewrite of the chirp program using a web ui"
readme = "README.md"
classifiers = [
    "Private :: Do Not Upload",
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Win32",
    "License :: OSI Approved :: GnU General Public License v3 (GPLv3)"
]
requires-python = ">=3.12"
dependencies = [
    "pyserial",
    "requests",
    "suds",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pywin32; platform_system == 'Windows'",
]
dynamic = ["version"]

[project.scripts]
chirp-web = "chirp_web.webui.main:main"

[tool.setuptools_scm]
version_file = "src/chirp_web/__version__.py"

[tools.setup.package-data]
"chirp_web" = ["py.typed"]

[tool.setuptools.package-data]
chirp_web = ["py.typed", "webui/static/*"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
log_file = "pytest.log"
log_file_mode = "w"
addopts = [
    "--import-mode=importlib",
]
